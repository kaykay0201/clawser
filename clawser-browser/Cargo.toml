[package]
name = "clawser-browser"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Antidetect browser automation powered by chromiumoxide CDP"
repository = "https://github.com/kaykay0201/clawser"
homepage = "https://github.com/kaykay0201/clawser"
documentation = "https://docs.rs/clawser-browser"

[dependencies]
chromiumoxide = { version = "0.9", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
wreq = { version = "6.0.0-rc.28", features = ["cookies", "json", "gzip", "brotli", "deflate", "socks"] }
wreq-util = { version = "3.0.0-rc.10", features = ["emulation"] }
