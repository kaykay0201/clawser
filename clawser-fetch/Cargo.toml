[package]
name = "clawser-fetch"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Chromium-powered HTTP client with realistic browser fingerprints"
license = "MIT"
repository = "https://github.com/kaykay0201/clawser"
keywords = ["http", "fingerprint", "browser", "antidetect", "fetch"]
categories = ["web-programming::http-client"]
readme = "README.md"

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
